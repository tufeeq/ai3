name: TAGX3 Validation Snapshots
on:
  workflow_dispatch:
  schedule:
    - cron: '7 12-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tagx3-validation-snapshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Syntax/static gate
        run: npm run check
      - name: Core/UI/data-contract gate
        run: npm test
      - name: Capture immutable validation snapshot
        run: node scripts/capture-validation-snapshot.mjs
      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'TAGX3 Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add validation/snapshots
          git diff --cached --quiet && exit 0
          git commit -m 'validation: capture immutable market snapshot'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
