name: TAGX3 Validation Snapshots
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'core/validation-engine.js'
      - 'validation/protocol.json'
      - 'scripts/capture-validation-snapshot.mjs'
      - 'scripts/build-validation-scorecard.mjs'
      - 'tests/validation-snapshot-contract.mjs'
      - 'tests/validation-engine-contract.js'
      - '.github/workflows/validation-snapshots.yml'
      - 'package.json'
  schedule:
    - cron: '7,22,37,52 12-22 * * 1-5'
permissions:
  contents: write
  actions: write
concurrency:
  group: tagx3-validation-snapshots
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Syntax/static gate
        run: npm run check
      - name: Core/UI/data-contract gate
        run: npm test
      # The validation cadence is empirically more reliable than the independent
      # intelligence/news crons. Reconcile intelligence after the full repository
      # gate so a stale artifact cannot remain live for hours merely because one
      # scheduled workflow was delayed. The intelligence workflow still owns all
      # build-time freshness, provenance and full-contract validation.
      - name: Dispatch intelligence freshness reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run intelligence-feed.yml --repo "${{ github.repository }}" --ref main
      - name: Capture immutable validation snapshot
        run: node scripts/capture-validation-snapshot.mjs
      - name: Build causal validation scorecards
        run: npm run validation:scorecard
      - name: Commit snapshot and scorecards
        run: |
          set -euo pipefail
          git config user.name 'TAGX3 Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add validation/snapshots validation/scorecards
          git diff --cached --quiet && exit 0
          git commit -m 'validation: capture snapshot and refresh scorecard'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
