name: TAGX3 Validation Snapshots
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAGX3 Intelligence Feed"]
    types: [completed]
  push:
    branches: [ main ]
    paths:
      - 'core/validation-engine.js'
      - 'validation/protocol.json'
      - 'scripts/capture-validation-snapshot.mjs'
      - 'scripts/build-validation-scorecard.mjs'
      - 'tests/validation-snapshot-contract.mjs'
      - 'tests/validation-engine-contract.js'
      - 'tests/validation-workflow-contract.js'
      - '.github/workflows/validation-snapshots.yml'
      - 'package.json'
  # Keep the original 15-minute schedule as an independent fallback. The primary
  # measurement path is now event-coupled to a successful production intelligence
  # rebuild, because measured cadence showed scheduled capture alone was not reliable.
  schedule:
    - cron: '7,22,37,52 12-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: tagx3-validation-snapshots
  cancel-in-progress: false
jobs:
  capture:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebase latest main
        run: git pull --rebase origin main
      - name: Syntax/static gate
        run: npm run check
      - name: Core/UI/data-contract gate
        run: npm test
      - name: Capture immutable validation snapshot
        run: node scripts/capture-validation-snapshot.mjs
      - name: Build causal validation scorecards
        run: npm run validation:scorecard
      - name: Commit snapshot and scorecards
        run: |
          set -euo pipefail
          git config user.name 'TAGX3 Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add validation/snapshots validation/scorecards
          git diff --cached --quiet && exit 0
          git commit -m 'validation: capture snapshot and refresh scorecard'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*5))
          done
          exit 1
