name: TAGX3 CI
on:
  push:
    branches: [ main, tagx3-clean-rebuild, tagx3-visual-dashboard ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and static checks
        run: npm run check
      - name: Critical live-feed guard contract
        run: node --check live-source-guard.js && node --check tests/live-source-guard-contract.js && node tests/live-source-guard-contract.js
      - name: Core and UI contract tests
        run: npm test
