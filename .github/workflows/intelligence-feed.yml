name: TAGX3 Intelligence Feed
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TAGX3 Market News"]
    types: [completed]
  push:
    branches: [ main ]
    paths:
      - 'scripts/build-intelligence.mjs'
      - 'scripts/sec-current-feed.mjs'
      - '.github/workflows/intelligence-feed.yml'
  # Prefer causal rebuilds after the upstream market-news workflow completes.
  # Keep one independent hourly run as a safety net if the upstream trigger is delayed or unavailable.
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: write
concurrency:
  group: tagx3-intelligence-feed
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build market intelligence feed
        run: node scripts/build-intelligence.mjs
      - name: Validate intelligence payload
        run: |
          node - <<'NODE'
          const x=require('./data/intelligence.json');
          const generated=Date.parse(x.generatedAt||'');
          const ageMs=Date.now()-generated;
          const s=x.sourceStatus||{};
          const shapeOk=Number.isFinite(generated)&&Array.isArray(x.events)&&Array.isArray(x.shortlist)&&x.bySymbol&&typeof x.bySymbol==='object';
          const loadedOk=s.marketDataLoaded===true&&x.shortlist.length>0;
          const freshnessShape=typeof s.marketDataFresh==='boolean'&&typeof s.marketWindowOpen==='boolean'&&typeof s.live==='boolean';
          const freshnessTruth=s.live===s.marketDataFresh&&(!s.live||(s.marketWindowOpen===true&&Number.isFinite(s.marketDataAgeMin)&&s.marketDataAgeMin<=15));
          const freshBuild=ageMs>=0&&ageMs<=10*60*1000;
          console.log({generatedAt:x.generatedAt,ageSeconds:Math.round(ageMs/1000),events:x.events?.length,shortlist:x.shortlist?.length,sourceStatus:s,errors:Array.isArray(x.errors)?x.errors.length:null});
          if(!shapeOk||!loadedOk||!freshnessShape||!freshnessTruth||!freshBuild) process.exit(1);
          NODE
      # Commits made with the workflow GITHUB_TOKEN do not trigger normal push CI.
      # Run the same syntax/core/UI/data-contract suite here before any bot commit reaches main.
      - name: Full repository contracts before data commit
        run: |
          npm run check
          npm test
      - name: Commit changed intelligence only
        run: |
          set -euo pipefail
          git config user.name 'tagx3-intelligence-bot'
          git config user.email 'actions@users.noreply.github.com'
          cp data/intelligence.json /tmp/tagx3-intelligence.json
          BUILDER_SHA="$(git hash-object scripts/build-intelligence.mjs)"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            if [ "$(git hash-object scripts/build-intelligence.mjs)" != "$BUILDER_SHA" ]; then
              node scripts/build-intelligence.mjs
              cp data/intelligence.json /tmp/tagx3-intelligence.json
              BUILDER_SHA="$(git hash-object scripts/build-intelligence.mjs)"
            else
              cp /tmp/tagx3-intelligence.json data/intelligence.json
            fi
            npm run check
            npm test
            git add data/intelligence.json
            git diff --cached --quiet && exit 0
            git commit -m 'data: refresh catalyst and news intelligence'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*4))
          done
          exit 1
